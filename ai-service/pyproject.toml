[project]
name = "traumasense-ai-service"
version = "1.0.0"
description = "TraumaSense AI - stateless AI compute microservice (voice, NLP, emotion, SVI, recommendation, explainability engines)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "soundfile>=0.12.1",
    "librosa>=0.11.0",
    "praat-parselmouth>=0.4.7",
    "anthropic>=1.7.0",
    "faster-whisper>=1.2.1",
    "fastembed>=0.8.0",
]

# Not in core dependencies: opt-in only (ENABLE_INDIC_TRANSLATION /
# ENABLE_INDIC_BERT_SEMANTIC), and transformers+torch are real heavy
# dependencies (order of 1GB+ combined) not needed unless one of these
# specific features is turned on - see app/engines/translation_engine.py
# and app/engines/indic_semantic_engine.py's docstrings. Install with
# `uv sync --extra indic-nlp`.
[project.optional-dependencies]
indic-nlp = [
    "transformers>=4.45.0",
    "torch>=2.4.0",
]

# Separate from indic-nlp above: nemo_toolkit[asr] (for
# app/engines/speech_engine.py's IndicConformerProvider) is a much heavier,
# more install-finicky dependency than transformers+torch alone (pulls in
# pytorch-lightning, hydra-core, sentencepiece, and more). Kept as its own
# extra so choosing IndicBERT/IndicTrans2 doesn't force this much larger
# install, and vice versa. Install with `uv sync --extra indic-asr`.
indic-asr = [
    "nemo_toolkit[asr]>=2.0.0",
]

# For scoped negation detection (see app/engines/negation_engine.py) -
# unlike every other optional engine above, neither package needs any
# downloaded model weights (negspacy is a rule-based NegEx implementation
# over a blank spaCy tokenizer), so this works in network-restricted
# environments that block HuggingFace/model-weight hosts, including this
# sandbox. Install with `uv sync --extra negation`.
negation = [
    "spacy>=3.8.0",
    "negspacy>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
# B008 (function-call-in-default-argument) flags FastAPI's idiomatic
# `Depends(...)` as a default argument, which is the framework's intended
# pattern, not a bug - ignored rather than working around it everywhere.
ignore = ["B008"]
